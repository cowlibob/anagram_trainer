<!DOCTYPE html>
<html>
<head>
    <title>Ruby WASM Simple Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@ruby/3.3-wasm-wasi@2.6.0/dist/browser.script.iife.js"></script>
</head>
<body>
    <h1>Ruby WASM Simple Test</h1>
    <pre id="output">Loading...</pre>
