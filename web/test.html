<!DOCTYPE html>
<html>
<head>
    <title>Ruby WASM Test</title>
</head>
<body>
    <h1>Ruby WASM Test</h1>
    <pre id="output"></pre>
    <script type="module">
        import { DefaultRubyVM } from "https://cdn.jsdelivr.net/npm/@ruby/3.3-wasm-wasi@2.6.0/dist/esm/browser.js";

        const output = document.getElementById('output');

        async function test() {
            try {
                output.textContent = "Loading Ruby WASM...\n";

                const response = await fetch("https://cdn.jsdelivr.net/npm/@ruby/3.3-wasm-wasi@2.6.0/dist/ruby+stdlib.wasm");
                output.textContent += `Fetch complete (${response.status})\n`;

                const buffer = await response.arrayBuffer();
                output.textContent += `Downloaded ${buffer.byteLength} bytes\n`;

                const module = await WebAssembly.compile(buffer);
                output.textContent += "WASM compiled\n";

                const { vm } = await DefaultRubyVM(module);
                output.textContent += "VM initialized\n";

                const result = vm.eval("RUBY_VERSION");
                output.textContent += `Ruby version: ${result}\n`;

                vm.eval(`
                    require 'js'
                    JS.global[:console].call(:log, "Hello from Ruby!")
                `);

                output.textContent += "\n✅ All tests passed! Check browser console for Ruby message.";

            } catch (error) {
                output.textContent += `\n❌ Error: ${error.message}\n${error.stack}`;
                console.error(error);
            }
        }

        test();
    </script>
</body>
</html>
